{% extends 'orders/base.html' %}
{% block title %}Update DO Status{% endblock %}
{% block content %}

<h1>Update DO Status for Vehicle: {{ vehicle.vehicle_number }}</h1>

{% for order in orders %}
<div style="background:#fff;padding:15px;border-radius:10px;margin-bottom:15px;box-shadow:0 4px 8px rgba(0,0,0,.1)">

    <div style="font-size:18px;text-align:center;margin-bottom:10px">
        {{ order.do_number }} - {{ order.customer_name }}
    </div>

    <form method="post" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        {% csrf_token %}
        <input type="hidden" name="do_number" value="{{ order.do_number }}">

        <button type="submit"
                name="status"
                value="Not Delivered"
                style="background:#dc3545;color:white;padding:12px 20px;border:none;border-radius:6px;cursor:pointer;">
            ❌ Not Delivered
        </button>

        <button type="submit"
                name="status"
                value="Delivered"
                style="background:#28a745;color:white;padding:12px 20px;border:none;border-radius:6px;cursor:pointer;">
            ✅ Delivered
        </button>

        <button type="submit"
                name="status"
                value="Partial Delivery"
                style="background:#007bff;color:white;padding:12px 20px;border:none;border-radius:6px;cursor:pointer;">
            📦 Partial Delivery
        </button>
    </form>
</div>
{% endfor %}

{% endblock %}
